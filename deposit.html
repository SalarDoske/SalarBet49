<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalarBet - Crypto Deposit</title>
    <style>
        body {
            background-color: #0f0c29;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .deposit-container {
            max-width: 500px;
            margin: 40px auto;
            background: #1e1b4b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #10b981;
        }
        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
        }
        label {
            font-size: 14px;
            color: #cbd5e1;
        }
        input, select {
            padding: 12px;
            border-radius: 6px;
            border: none;
            background: #312e81;
            color: white;
            font-size: 16px;
        }
        .wallet-box {
            background: #0f172a;
            padding: 12px;
            border-radius: 6px;
            word-break: break-all;
            font-family: monospace;
            color: #38bdf8;
            margin-bottom: 15px;
            font-size: 13px;
        }
        .qr-img {
            width: 180px;
            height: 180px;
            border-radius: 8px;
            margin-bottom: 15px;
            background: white;
            padding: 5px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #059669;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #94a3b8;
            text-decoration: none;
        }
        .back-link:hover {
            color: white;
        }
    </style>
</head>
<body>

    <div class="deposit-container">
        <h2>دانانا پارەی ب کریپتۆ (Bitcoin)</h2>
        
        <!-- وێنەی QR کۆد -->
        <img src="./img/Screenshot_٢٠٢٦٠٩١٤-٢٢٣٧٠١_Telegram.jpg" alt="Bitcoin QR Code" class="qr-img">

        <div class="form-group">
            <label>ناونیشانی ولێتا مە (Bitcoin - BTC):</label>
            <div class="wallet-box">bc1qtrfp6jj8n47hslrv7dyv7wxz8sfkvyhlyhwluv</div>
            <small style="color: #94a3b8; text-align: center;">تکایە تەنها Bitcoin بنێرە بۆ ئەڤی ناونیشانی!</small>
        </div>

        <form id="cryptoForm">
            <div class="form-group">
                <label for="amount">بڕێ پارەی (بە USD / BTC):</label>
                <input type="number" id="amount" name="amount" placeholder="بۆ نموونە: 50" required step="0.0001" min="0.0001">
            </div>

            <div class="form-group">
                <label for="currency">دراو:</label>
                <select id="currency" name="currency">
                    <option value="BTC">Bitcoin (BTC)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tx_hash">کۆدی گواستنەوەی (TxID / Transaction Hash):</label>
                <input type="text" id="tx_hash" name="tx_hash" placeholder="کۆدی TxID لێرە بنووسە" required>
            </div>

            <button type="submit">ناردنا داواکارییێ</button>
        </form>

        <a href="/" class="back-link">زڤڕین بۆ مالپه‌ری سه‌ره‌کی</a>
    </div>

    <script>
        document.getElementById('cryptoForm').onsubmit = async (e) => {
            e.preventDefault();
            
            const amount = document.getElementById('amount').value;
            const currency = document.getElementById('currency').value;
            const tx_hash = document.getElementById('tx_hash').value;

            const response = await fetch('/api/crypto-deposit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ amount, currency, tx_hash })
            });

            const result = await response.json();
            if (result.success) {
                alert(result.message);
                window.location.href = '/';
            } else {
                alert(result.error || 'شاشیەک ڕووی دا!');
            }
        };
    </script>
</body>
</html>
